<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>GTA 5</title>
<style>html,body{margin:0;height:100%;background:#0b0b12;color:#eee;font-family:system-ui,sans-serif}
body{display:flex;align-items:center;justify-content:center;text-align:center}
button{font-size:22px;font-weight:700;padding:16px 40px;border:0;border-radius:10px;background:#2e9a4a;color:#fff;cursor:pointer}
button:hover{background:#38b457}p{color:#999;max-width:440px;margin:18px auto 0;font-size:14px;line-height:1.5}</style></head>
<body><div>
<h1 style="margin:0 0 24px;font-size:48px">GTA 5</h1>
<button id="play">Play on playgta5.com</button>
<p>Opens the game on its own site in a new tab. Your Mist tab stays open.</p>
</div>
<script>
document.getElementById('play').onclick = function () {
  var w = window.open('https://playgta5.com/', '_blank');
  if (!w) location.href = 'https://playgta5.com/';
};
</script></body></html>
