<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>GTA 5</title>
<style>
html,body{margin:0;height:100%;background:#0b0b12;overflow:hidden;font-family:system-ui,sans-serif}
#game{position:fixed;inset:0;width:100%;height:100%;border:0;display:block}
#help{position:fixed;inset:0;display:none;align-items:center;justify-content:center;text-align:center;color:#eee;background:#0b0b12}
#help p{color:#999;max-width:460px;margin:16px auto 0;font-size:14px;line-height:1.5}
#help button{font-size:18px;font-weight:700;padding:12px 32px;margin-top:22px;border:0;border-radius:10px;background:#2e9a4a;color:#fff;cursor:pointer}
#help button:hover{background:#38b457}
</style></head>
<body>
<iframe id="game" allow="fullscreen; pointer-lock; autoplay; gamepad; clipboard-read; clipboard-write; microphone" allowfullscreen></iframe>
<div id="help"><div>
  <h1 style="margin:0;font-size:40px">GTA 5</h1>
  <p>The game server didn't answer. It may be offline or restarting.</p>
  <button id="retry">Try again</button>
  <p><a id="tab" href="#" style="color:#7fb0ff">Open it in a new tab instead</a></p>
</div></div>
<script>
// Where the game is served from (serve_local.py behind serve_https.py on the Mist server).
var GAME_URL = 'https://195.62.47.222:8001/';

var frame = document.getElementById('game'), help = document.getElementById('help');
document.getElementById('tab').href = GAME_URL;
document.getElementById('tab').target = '_blank';

function load() {
  help.style.display = 'none';
  frame.style.display = 'block';
  // Check the server answers first, so an offline server shows a message instead of a blank frame.
  fetch(GAME_URL, { mode: 'no-cors', cache: 'no-store' }).then(function () {
    frame.src = GAME_URL;
    setTimeout(function () { try { frame.focus(); } catch (e) {} }, 500);
  }).catch(function () {
    frame.style.display = 'none';
    help.style.display = 'flex';
  });
}
document.getElementById('retry').onclick = load;
load();
</script>
</body></html>
