<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Counter Attack</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#0d1117;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#fff;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none}
  canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block}
  .hud{position:fixed;inset:0;pointer-events:none;z-index:2}
  .hide{display:none!important}
  /* crosshair */
  #xh{position:absolute;left:50%;top:50%;width:0;height:0}
  #xh i{position:absolute;background:#7dff7a;box-shadow:0 0 2px #000}
  #xh .t,#xh .b{width:2px;height:9px;left:-1px}#xh .l,#xh .r{height:2px;width:9px;top:-1px}
  #xh .dot{width:2px;height:2px;left:-1px;top:-1px}
  #hit{position:absolute;left:50%;top:50%;width:26px;height:26px;margin:-13px 0 0 -13px;opacity:0;transition:opacity .15s}
  #hit:before,#hit:after{content:"";position:absolute;left:12px;top:-2px;width:2px;height:30px;background:#fff;transform:rotate(45deg);box-shadow:0 0 2px #000}
  #hit:after{transform:rotate(-45deg)}
  #hit.head:before,#hit.head:after{background:#ff4b4b}
  #hit.on{opacity:1;transition:none}
  /* top score */
  #score{position:absolute;top:30px;left:50%;transform:translateX(-50%);display:flex;align-items:stretch;font-weight:800;font-size:22px;filter:drop-shadow(0 2px 4px rgba(0,0,0,.5))}
  #score div{padding:4px 14px;min-width:46px;text-align:center}
  #score .r{background:rgba(200,48,40,.88);border-radius:6px 0 0 6px}#score .bl{background:rgba(40,100,215,.88);border-radius:0 6px 6px 0}
  #score .mid{background:rgba(10,14,20,.8);font-size:11px;letter-spacing:.12em;padding:9px 10px;color:#b8bcbf;min-width:0}
  #score .me{box-shadow:inset 0 -3px 0 #fff}
  /* bottom panels */
  .panel{position:absolute;bottom:18px;background:rgba(10,14,20,.62);border-radius:8px;padding:8px 14px;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
  #hpP{left:18px;display:flex;align-items:center;gap:10px}
  #hpN{font-size:34px;font-weight:800;min-width:62px}
  #hpBar{width:140px;height:8px;background:rgba(255,255,255,.15);border-radius:4px;overflow:hidden}#hpBar i{display:block;height:100%;background:#5be06b;transition:width .15s}
  #ammoP{right:18px;text-align:right}
  #ammoN{font-size:34px;font-weight:800}#ammoN small{font-size:16px;color:#9aa4ad;font-weight:600}
  #wpnN{font-size:11px;letter-spacing:.16em;color:#b8bcbf;text-transform:uppercase}
  #reloadT{font-size:12px;color:#ffcc4d;height:14px}
  /* kill feed */
  #feed{position:absolute;top:10px;right:12px;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
  #feed div{background:rgba(10,14,20,.7);padding:4px 9px;border-radius:4px;font-size:13px;font-weight:700;white-space:nowrap;animation:fin .2s}
  #feed .mine{box-shadow:inset 0 0 0 2px #ffcc4d}
  #feed span.w{color:#9aa4ad;font-size:10px;letter-spacing:.08em;margin:0 7px;font-weight:600}
  .t0{color:#ff6b5e}.t1{color:#6aa8ff}
  @keyframes fin{from{transform:translateX(20px);opacity:0}}
  /* centre messages */
  #msg{position:absolute;left:50%;top:30%;transform:translateX(-50%);text-align:center;font-weight:800;text-shadow:0 2px 6px rgba(0,0,0,.7)}
  #msg .big{font-size:30px}#msg .small{font-size:15px;color:#d0d4d8;font-weight:600;margin-top:6px}
  #killMsg{position:absolute;left:50%;top:62%;transform:translateX(-50%);font-weight:800;font-size:16px;color:#ffcc4d;text-shadow:0 2px 4px #000;opacity:0;transition:opacity .4s}
  #killMsg.on{opacity:1;transition:none}
  #dmg{position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 55%,rgba(200,0,0,.55));opacity:0;transition:opacity .5s}
  #dmg.on{opacity:1;transition:none}
  #dirs{position:absolute;left:50%;top:50%;width:0;height:0}
  #dirs i{position:absolute;left:-40px;top:-150px;width:80px;height:24px;border-radius:50% 50% 0 0;border-top:6px solid rgba(255,40,40,.85);transform-origin:40px 150px;opacity:1;transition:opacity 1s}
  #scope{position:absolute;inset:0;background:radial-gradient(circle at center,transparent 0,transparent 31vmin,#000 31.3vmin)}
  #scope:before,#scope:after{content:"";position:absolute;background:#000;left:50%;top:0;bottom:0;width:2px;margin-left:-1px}
  #scope:after{top:50%;left:0;right:0;width:auto;height:2px;bottom:auto;margin:-1px 0 0}
  #net{position:absolute;left:12px;top:10px;font-size:11px;color:#9aa4ad;text-shadow:0 1px 2px #000}
  /* scoreboard */
  #board{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(680px,94vw);background:rgba(10,14,20,.9);border-radius:10px;padding:14px;display:grid;grid-template-columns:1fr 1fr;gap:14px}
  #board h3{margin:0 0 6px;font-size:14px;letter-spacing:.1em;display:flex;justify-content:space-between}
  #board table{width:100%;border-collapse:collapse;font-size:13px}
  #board td{padding:4px 6px;border-top:1px solid rgba(255,255,255,.07)}#board td:nth-child(n+2){text-align:right;width:34px;color:#b8bcbf}
  #board tr.me td{background:rgba(255,204,77,.14);color:#fff}
  #board .bot{color:#8f98a0;font-size:10px;margin-left:5px}
  /* menu */
  #menu{position:fixed;inset:0;z-index:10;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 30%,rgba(40,52,68,.92),rgba(8,10,14,.96) 70%);pointer-events:auto}
  .mbox{width:min(440px,92vw);text-align:center}
  .logo{font-size:44px;font-weight:900;letter-spacing:.12em;line-height:1;margin:0}
  .logo b{color:#ff5a4a}.logo span{color:#5a9bff}
  .tag{color:#8f98a0;font-size:12px;letter-spacing:.24em;text-transform:uppercase;margin:8px 0 26px}
  .btn{display:block;width:100%;margin:10px 0;padding:14px;border:0;border-radius:6px;font:inherit;font-size:17px;font-weight:800;letter-spacing:.06em;color:#fff;cursor:pointer;background:#3d4450}
  .btn.go{background:linear-gradient(180deg,#ff7a3d,#e0501c)}.btn.blue{background:linear-gradient(180deg,#4b8dff,#2a62d6)}
  .btn:disabled{opacity:.45;cursor:default}
  .btn small{display:block;font-size:11px;font-weight:600;letter-spacing:0;opacity:.85;margin-top:3px}
  .opts{display:grid;grid-template-columns:auto 1fr;gap:10px 14px;align-items:center;text-align:left;margin:18px 0 6px;font-size:13px;color:#b8bcbf}
  .opts input[type=range]{width:100%}.opts select{background:#2a2f37;color:#fff;border:1px solid #3d4450;border-radius:4px;padding:5px;font:inherit}
  .keys{font-size:11px;color:#6b7680;margin-top:14px;line-height:1.7}
  .who{font-size:13px;color:#b8bcbf;margin-bottom:8px}.who b{color:#fff}
  #menuErr{color:#ff8a80;font-size:13px;min-height:16px}
  /* touch controls */
  #touch{position:fixed;inset:0;z-index:3;pointer-events:none}
  #touch .tb{position:absolute;pointer-events:auto;border-radius:50%;background:rgba(255,255,255,.14);border:2px solid rgba(255,255,255,.35);color:#fff;font-weight:800;font-size:13px;display:grid;place-items:center;letter-spacing:.04em}
  #touch .tb.on{background:rgba(255,255,255,.35)}
  #tFire{right:7vw;bottom:24vh;width:96px;height:96px;font-size:15px!important;background:rgba(255,80,60,.3)!important}
  #tJump{right:3vw;bottom:8vh;width:64px;height:64px}
  #tReload{right:calc(7vw + 110px);bottom:10vh;width:56px;height:56px}
  #tSwap{right:calc(7vw + 112px);bottom:calc(24vh + 40px);width:56px;height:56px}
  #tScope{right:calc(7vw + 20px);bottom:calc(24vh + 112px);width:56px;height:56px}
  #tMenu{left:12px;top:44px;width:44px;height:44px;border-radius:8px!important}
  #tBoard{right:12px;top:auto;bottom:calc(24vh + 190px);width:44px;height:44px;border-radius:8px!important}
  #stick{position:absolute;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;border:2px solid rgba(255,255,255,.3);background:rgba(255,255,255,.08)}
  #stick i{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;background:rgba(255,255,255,.35)}
  body.touch #hpP{bottom:auto;top:44px;left:66px;transform:scale(.8);transform-origin:left top}
  body.touch #ammoP{bottom:auto;top:44px;right:auto;left:66px;margin-top:52px;transform:scale(.8);transform-origin:left top;text-align:left}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hud" id="hud">
  <div id="xh"><i class="t"></i><i class="b"></i><i class="l"></i><i class="r"></i><i class="dot"></i></div>
  <div id="hit"></div>
  <div id="scope" class="hide"></div>
  <div id="dmg"></div>
  <div id="dirs"></div>
  <div id="score"><div class="r" id="sR">0</div><div class="mid">FIRST TO ∞</div><div class="bl" id="sB">0</div></div>
  <div id="feed"></div>
  <div id="net"></div>
  <div id="msg"></div>
  <div id="killMsg"></div>
  <div class="panel" id="hpP"><div id="hpN">100</div><div><div id="hpBar"><i style="width:100%"></i></div></div></div>
  <div class="panel" id="ammoP"><div id="wpnN">Rifle</div><div id="ammoN">30 <small>/ ∞</small></div><div id="reloadT"></div></div>
  <div id="board" class="hide"></div>
</div>
<div id="touch" class="hide">
  <div id="stick" class="hide"><i></i></div>
  <div class="tb" id="tFire">FIRE</div>
  <div class="tb" id="tJump">JUMP</div>
  <div class="tb" id="tReload">R</div>
  <div class="tb" id="tSwap">⇄</div>
  <div class="tb" id="tScope">⊕</div>
  <div class="tb" id="tMenu">II</div>
  <div class="tb" id="tBoard">☰</div>
</div>
<div id="menu">
  <div class="mbox">
    <h1 class="logo"><b>COUNTER</b> <span>ATTACK</span></h1>
    <div class="tag">Endless team deathmatch</div>
    <div class="who" id="who"></div>
    <button class="btn go" id="bOnline">PLAY ONLINE<small id="onlineSub">Red vs Blue with other Mist players</small></button>
    <button class="btn blue" id="bBots">PLAY VS BOTS<small>Offline, no account needed</small></button>
    <button class="btn hide" id="bResume">RESUME</button>
    <button class="btn hide" id="bLeave">LEAVE MATCH</button>
    <div id="menuErr"></div>
    <div class="opts">
      <span>Look speed</span><input type="range" id="oSens" min="0.2" max="3" step="0.05">
      <span>Graphics</span><select id="oGfx"><option value="high">High (shadows)</option><option value="low">Fast</option></select>
      <span>Touch controls</span><select id="oTouch"><option value="auto">Auto</option><option value="on">On</option><option value="off">Off</option></select>
    </div>
    <div class="keys">WASD move · Mouse aim · Click shoot · Right-click scope<br>Space jump · R reload · 1 2 3 / wheel weapons · Tab scores · Esc menu</div>
  </div>
</div>
<script>/*THREE*/</script>
<script>/*SIM*/</script>
<script>
(function () {
  'use strict';
  var S = window.CASim, W = S.WEAPONS, MAP = S.MAP;
  var $ = function (id) { return document.getElementById(id); };
  var store = { get: function (k, d) { try { var v = localStorage.getItem('ca:' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
    set: function (k, v) { try { localStorage.setItem('ca:' + k, JSON.stringify(v)); } catch (e) {} } };
  var opts = { sens: store.get('sens', 1), gfx: store.get('gfx', null), touch: store.get('touch', 'auto') };
  var isTouchDev = (navigator.maxTouchPoints || 0) > 0 && window.matchMedia && matchMedia('(pointer: coarse)').matches;
  if (!opts.gfx) opts.gfx = isTouchDev ? 'low' : 'high';
  var SERVER = String(window.MIST_SERVER || '').replace(/\/+$/, ''), TOKEN = window.MIST_TOKEN || '', USER = window.MIST_USER || '';
  var NAME = USER || store.get('name', 'Player');

  /* ================= renderer / scene ================= */
  var canvas = $('c');
  var renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: opts.gfx === 'high', powerPreference: 'high-performance' });
  renderer.autoClear = false;
  var scene = new THREE.Scene();
  scene.background = new THREE.Color(0x9fc4e8);
  scene.fog = new THREE.Fog(0x9fc4e8, 45, 120);
  var camera = new THREE.PerspectiveCamera(75, 1, 0.05, 300);
  camera.rotation.order = 'YXZ';
  var viewScene = new THREE.Scene(), viewCam = new THREE.PerspectiveCamera(60, 1, 0.01, 10);
  viewScene.add(new THREE.HemisphereLight(0xffffff, 0x445566, 1.0));
  var vdl = new THREE.DirectionalLight(0xffffff, 0.6); vdl.position.set(1, 2, 1); viewScene.add(vdl);
  var hemi = new THREE.HemisphereLight(0xdbe9ff, 0x5a5048, 0.75); scene.add(hemi);
  var sun = new THREE.DirectionalLight(0xfff1dc, 0.85); sun.position.set(30, 60, 20); scene.add(sun); scene.add(sun.target);
  function applyGfx() {
    var dpr = Math.min(window.devicePixelRatio || 1, opts.gfx === 'high' ? 2 : 1.25);
    renderer.setPixelRatio(dpr);
    renderer.shadowMap.enabled = opts.gfx === 'high';
    sun.castShadow = opts.gfx === 'high';
    if (sun.castShadow) {
      sun.shadow.mapSize.set(2048, 2048); var sc = sun.shadow.camera; sc.left = -52; sc.right = 52; sc.top = 40; sc.bottom = -40; sc.near = 10; sc.far = 140; sc.updateProjectionMatrix(); sun.shadow.bias = -0.0008;
    }
    resize();
  }
  function resize() {
    var w = window.innerWidth, h = window.innerHeight;
    renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix(); viewCam.aspect = w / h; viewCam.updateProjectionMatrix();
  }
  window.addEventListener('resize', resize);

  /* ---------- procedural textures ---------- */
  function tex(draw, size) {
    var c = document.createElement('canvas'); c.width = c.height = size || 128; var g = c.getContext('2d'); draw(g, c.width);
    var t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.anisotropy = 4; t.magFilter = THREE.LinearFilter; return t;
  }
  function noise(g, n, a, col) { for (var i = 0; i < n; i++) { g.fillStyle = col || ('rgba(0,0,0,' + (Math.random() * a) + ')'); g.fillRect(Math.random() * 128, Math.random() * 128, 2, 2); } }
  var T = {
    floor: tex(function (g) { g.fillStyle = '#8d8a83'; g.fillRect(0, 0, 128, 128); noise(g, 900, 0.12); g.strokeStyle = 'rgba(0,0,0,.18)'; g.lineWidth = 2; g.strokeRect(0, 0, 128, 128); }),
    wall: tex(function (g) { g.fillStyle = '#5d6b78'; g.fillRect(0, 0, 128, 128); noise(g, 600, 0.12); g.fillStyle = 'rgba(0,0,0,.18)'; g.fillRect(0, 60, 128, 4); g.fillRect(62, 0, 4, 60); g.fillRect(0, 124, 128, 4); g.fillRect(30, 64, 4, 60); g.fillRect(94, 64, 4, 60); }),
    concrete: tex(function (g) { g.fillStyle = '#b9b2a4'; g.fillRect(0, 0, 128, 128); noise(g, 900, 0.1); g.fillStyle = 'rgba(0,0,0,.12)'; g.fillRect(0, 0, 128, 3); g.fillRect(0, 0, 3, 128); }),
    crate: tex(function (g) {
      g.fillStyle = '#b07a3e'; g.fillRect(0, 0, 128, 128); for (var i = 0; i < 6; i++) { g.fillStyle = i % 2 ? '#a06c34' : '#bb8546'; g.fillRect(0, i * 21, 128, 21); }
      g.strokeStyle = '#6e4620'; g.lineWidth = 10; g.strokeRect(5, 5, 118, 118); g.beginPath(); g.moveTo(8, 8); g.lineTo(120, 120); g.stroke(); noise(g, 300, 0.15);
    })
  };
  var MATS = [
    new THREE.MeshLambertMaterial({ map: T.concrete }),
    new THREE.MeshLambertMaterial({ map: T.wall }),
    new THREE.MeshLambertMaterial({ map: T.concrete, color: 0xe8e2d4 }),
    new THREE.MeshLambertMaterial({ map: T.crate })
  ];
  /* Box geometry with world-scaled UVs so textures tile instead of stretching. */
  function boxGeo(w, h, d, scale) {
    var gm = new THREE.BoxGeometry(w, h, d), uv = gm.attributes.uv, s = scale || 2;
    var dims = [[d, h], [d, h], [w, d], [w, d], [w, h], [w, h]];
    for (var f = 0; f < 6; f++) for (var v = 0; v < 4; v++) { var i = f * 4 + v; uv.setXY(i, uv.getX(i) * dims[f][0] / s, uv.getY(i) * dims[f][1] / s); }
    return gm;
  }
  /* ---------- the map ---------- */
  (function buildMap() {
    var fw = MAP.w * 2 + 2, fd = MAP.d * 2 + 2;
    var fm = new THREE.MeshLambertMaterial({ map: T.floor }); T.floor.repeat.set(fw / 3, fd / 3);
    var floor = new THREE.Mesh(new THREE.PlaneGeometry(fw, fd), fm); floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);
    // team base zones
    [[-1, 0xd23a2e], [1, 0x2f6fd6]].forEach(function (b) {
      var z = new THREE.Mesh(new THREE.PlaneGeometry(14, MAP.d * 2 - 2), new THREE.MeshBasicMaterial({ color: b[1], transparent: true, opacity: 0.16, depthWrite: false }));
      z.rotation.x = -Math.PI / 2; z.position.set(b[0] * (MAP.w - 7.5), 0.02, 0); scene.add(z);
      var stripe = new THREE.Mesh(new THREE.PlaneGeometry(0.4, MAP.d * 2 - 2), new THREE.MeshBasicMaterial({ color: b[1] }));
      stripe.rotation.x = -Math.PI / 2; stripe.position.set(b[0] * (MAP.w - 14.5), 0.03, 0); scene.add(stripe);
      // banner on the back wall
      var ban = new THREE.Mesh(new THREE.PlaneGeometry(0.1, 1), new THREE.MeshLambertMaterial({ color: b[1] }));
      ban.geometry = new THREE.BoxGeometry(0.2, 3, 10); ban.position.set(b[0] * (MAP.w - 0.15), 3, 0); scene.add(ban);
    });
    MAP.boxes.forEach(function (B) {
      var w = B[3] - B[0], h = B[4] - B[1], d = B[5] - B[2];
      var m = new THREE.Mesh(boxGeo(w, h, d, B[6] === 3 ? Math.max(w, h, d) : 2.5), MATS[B[6]] || MATS[0]);
      m.position.set((B[0] + B[3]) / 2, (B[1] + B[4]) / 2, (B[2] + B[5]) / 2);
      m.castShadow = m.receiveShadow = true; scene.add(m);
    });
    // distant hills so the sky isn't empty
    var hm = new THREE.MeshLambertMaterial({ color: 0x7d9a7a });
    for (var i = 0; i < 26; i++) {
      var a = i / 26 * Math.PI * 2, r = 110 + Math.random() * 20, hgt = 12 + Math.random() * 18;
      var hill = new THREE.Mesh(new THREE.ConeGeometry(18 + Math.random() * 14, hgt, 6), hm); hill.position.set(Math.cos(a) * r, hgt / 2 - 2, Math.sin(a) * r * 0.8); scene.add(hill);
    }
  })();

  /* ---------- characters ---------- */
  var TEAM_COL = [0xc8342b, 0x2f6fd6], SKIN = 0xe2b48c;
  function part(w, h, d, col, x, y, z) { var m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), new THREE.MeshLambertMaterial({ color: col })); m.position.set(x, y, z); m.castShadow = true; return m; }
  function gunModel(kind, col) {
    var g = new THREE.Group(), metal = 0x2b2f35, accent = col || 0x555b63;
    if (kind === 'pistol') { g.add(part(0.06, 0.08, 0.24, metal, 0, 0, -0.1)); g.add(part(0.05, 0.12, 0.06, accent, 0, -0.08, -0.02)); }
    else if (kind === 'sniper') { g.add(part(0.07, 0.09, 0.62, metal, 0, 0, -0.2)); g.add(part(0.035, 0.035, 0.5, metal, 0, 0.01, -0.72)); g.add(part(0.05, 0.05, 0.22, 0x111111, 0, 0.08, -0.22)); g.add(part(0.06, 0.12, 0.2, accent, 0, -0.03, 0.18)); }
    else { g.add(part(0.07, 0.1, 0.5, metal, 0, 0, -0.15)); g.add(part(0.04, 0.04, 0.3, metal, 0, 0.01, -0.52)); g.add(part(0.05, 0.16, 0.08, accent, 0, -0.12, -0.12)); g.add(part(0.06, 0.1, 0.18, accent, 0, -0.02, 0.17)); }
    return g;
  }
  function makeSoldier(team, name, isMate) {
    var g = new THREE.Group(), col = TEAM_COL[team], dark = team ? 0x1d3f7a : 0x6e1c17;
    var hip = new THREE.Group(); hip.position.y = 0.82; g.add(hip);
    var legL = new THREE.Group(), legR = new THREE.Group(); legL.position.set(-0.14, 0, 0); legR.position.set(0.14, 0, 0);
    legL.add(part(0.2, 0.8, 0.22, dark, 0, -0.4, 0)); legR.add(part(0.2, 0.8, 0.22, dark, 0, -0.4, 0)); hip.add(legL); hip.add(legR);
    var torso = part(0.56, 0.62, 0.32, col, 0, 0.32, 0); hip.add(torso);
    hip.add(part(0.6, 0.1, 0.34, 0x2a2a2a, 0, 0.04, 0));          // belt
    var head = new THREE.Group(); head.position.y = 0.82; hip.add(head);
    head.add(part(0.34, 0.34, 0.34, SKIN, 0, 0, 0));
    head.add(part(0.38, 0.14, 0.38, dark, 0, 0.15, 0));            // helmet

  $('touch').addEventListener('touchend', touchEnd); $('touch').addEventListener('touchcancel', touchEnd);

  /* ================= weapons ================= */
  function pick(w) {

  var ray = new THREE.Vector3();

    var dir = S.dirFrom(me.yaw + (Math.random() - 0.5) * spread * 2, me.pitch + (Math.random() - 0.5) * spread * 2);

  }

  /* ================= main loop ================= */

  function frame(nowMs) {

  }
  function update(dt, frozen) {

      localRoom.humanState('me', stateMsg());
      if (pendingHits.length) { localRoom.humanHits('me', pendingHits); pendingHits = []; }
      localRoom.step(dt); localRoom.flushEvents();
      var sn = localRoom.snapshot('me', feedId); localRoom.clearEvents('me'); applySnap(sn);
    }
    // remote players
    var tNow = performance.now();
    for (var id in others) {
      var o = others[id], p = o.data, m = o.mesh, u = m.userData, c = sample(o, tNow); if (!c || !p) continue;
      var px = m.position.x, pz = m.position.z; o.cur = c;
      m.position.set(c.x, c.y, c.z); m.rotation.y = c.yaw;
      var v = Math.hypot(c.x - px, c.z - pz) / Math.max(dt, 1e-3);
      o.walk += dt * Math.min(v, 7) * 1.7; var sw = v > 0.6 ? Math.sin(o.walk) * 0.6 : 0;
      u.legL.rotation.x = sw; u.legR.rotation.x = -sw; u.arms.rotation.x = c.pi;
      if (p.d) { o.deadT = (o.deadT || 0) + dt; m.rotation.x = -Math.min(1, o.deadT * 4) * Math.PI / 2; m.position.y = c.y + 0.2; if (o.deadT > 2.2) m.visible = false; }
      else { o.deadT = 0; m.rotation.x = 0; m.visible = true; }
      var prot = !!p.pr; for (var k = 0; k < u.mats.length; k++) { u.mats[k].transparent = prot; u.mats[k].opacity = prot ? 0.45 + 0.2 * Math.sin(tNow / 90) : 1; }
      u.flash.material.opacity = Math.max(0, u.flash.material.opacity - dt * 14);

          u.flash.material.opacity = 1; u.flash.rotation.z = Math.random() * 3;
          var eye = [c.x, c.y + S.EYE, c.z], d = S.dirFrom(c.yaw + (Math.random() - 0.5) * 0.03, c.pi + (Math.random() - 0.5) * 0.03), tt = S.rayWorld(eye, d, 80);
          var from = new THREE.Vector3(); u.flash.getWorldPosition(from);
          tracer(from, new THREE.Vector3(eye[0] + d[0] * tt, eye[1] + d[1] * tt, eye[2] + d[2] * tt));

  }
  function render(dt, nowMs) {
    // camera
    if (inMatch) {
      if (me.alive) { deadCam = 0; camera.position.set(me.x, me.y + S.EYE + (me.ground ? Math.sin(bobT * 2) * 0.03 : 0), me.z); camera.rotation.set(me.pitch + me.recoil, me.yaw, 0); }
      else { deadCam = Math.min(1, deadCam + dt * 1.5); camera.position.set(me.x, me.y + S.EYE - deadCam * 1.2 + 0.2, me.z); camera.rotation.set(me.pitch - deadCam * 0.4, me.yaw, deadCam * 0.5); }
      var fov = me.scoped ? 22 : 75; if (Math.abs(camera.fov - fov) > 0.1) { camera.fov += (fov - camera.fov) * Math.min(1, dt * 18); camera.updateProjectionMatrix(); }
    } else {
      var a = nowMs / 9000; camera.position.set(Math.cos(a) * 30, 14, Math.sin(a) * 22); camera.lookAt(0, 1, 0);
    }
    sun.position.set(camera.position.x + 30, 60, camera.position.z + 20); sun.target.position.set(camera.position.x, 0, camera.position.z);
    muzzleLight.intensity = Math.max(0, muzzleLight.intensity - dt * 30);

    var showVm = inMatch && me.alive && !me.scoped;
    if (showVm) {
      S.ORDER.forEach(function (k) { vmGuns[k].visible = k === me.w; });
      vmKick = Math.max(0, vmKick - dt * 8); me.swapT = Math.max(0, (me.swapT || 0) - dt);
      var rl = me.reloadUntil ? Math.sin(Math.min(1, (W[me.w].reload - (me.reloadUntil - now())) / W[me.w].reload) * Math.PI) : 0;
      vm.position.set(0.19 + Math.cos(bobT) * 0.008, -0.17 + Math.abs(Math.sin(bobT)) * 0.008 - rl * 0.1 - me.swapT * 0.4, -0.5 + vmKick * 0.04);
      vm.rotation.set(vmKick * 0.12 + rl * 0.6, 0, rl * 0.3);

  function hud() {

    $('hpN').textContent = Math.max(0, me.hp); var hb = $('hpBar').firstChild; hb.style.width = Math.max(0, me.hp) + '%'; hb.style.background = me.hp > 50 ? '#5be06b' : me.hp > 25 ? '#ffcc4d' : '#ff5a4a';
    $('ammoN').innerHTML = me.ammo[me.w] + ' <small>/ ' + wp.mag + '</small>'; $('wpnN').textContent = wp.name;
    $('reloadT').textContent = me.reloadUntil ? 'Reloading…' : me.ammo[me.w] === 0 ? 'Press R to reload' : '';
    var gap = 6 + (wp.spread + (me.moving ? wp.move : 0) + (me.ground ? 0 : 0.06) + me.bloom) * 260;
    var xh = $('xh').children; xh[0].style.top = (-gap - 9) + 'px'; xh[1].style.top = gap + 'px'; xh[2].style.left = (-gap - 9) + 'px'; xh[3].style.left = gap + 'px';
    $('xh').classList.toggle('hide', !me.alive || me.scoped || me.w === 'sniper');
    $('scope').classList.toggle('hide', !(me.scoped && me.alive));

    if (me.dead) msg.innerHTML = '<div class="big">ELIMINATED</div><div class="small">' + (me.killer ? 'by <b>' + esc(me.killer) + '</b> · ' : '') + 'respawning in ' + Math.ceil(me.respawnIn || 0) + '</div>';
    else if (snap && snap.you && snap.players.some(function (p) { return p.id === myId && p.pr; })) msg.innerHTML = '<div class="small">Spawn protection</div>';
    else msg.textContent = '';
    $('net').textContent = (mode === 'online' ? 'Online · ' + net.ping + ' ms · ' : 'Offline vs bots · ') + fps + ' fps';
  }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

  /* ================= menus ================= */
  function startMatch() { inMatch = true; paused = false; $('hud').classList.remove('hide'); $('menu').classList.add('hide'); $('menuErr').textContent = ''; updateTouch(); lock(); }

    $('bOnline').classList.toggle('hide', inMatch); $('bBots').classList.toggle('hide', inMatch);
    updateTouch();
  }
  var canOnline = !!(SERVER && TOKEN);
  $('bOnline').disabled = !canOnline;
  $('onlineSub').textContent = canOnline ? 'Red vs Blue with other Mist players' : 'Sign in to Mist (and launch from Mist) to play online';
  $('who').innerHTML = USER ? 'Playing as <b>' + esc(USER) + '</b>' : 'Playing as <b>' + esc(NAME) + '</b> (guest)';
  $('bOnline').onclick = function () { audio(); joinOnline(false); };
  $('bBots').onclick = function () { audio(); startOffline(); };
  $('bResume').onclick = function () { audio(); resume(); };

  $('oSens').value = opts.sens; $('oSens').oninput = function () { opts.sens = +this.value; store.set('sens', opts.sens); };
  $('oGfx').value = opts.gfx; $('oGfx').onchange = function () { opts.gfx = this.value; store.set('gfx', opts.gfx); applyGfx(); };

})();
