<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Mist Browser</title>
<style>
  html,body{margin:0;height:100%;background:#1b2838;color:#c7d5e0;font:14px/1.45 "Motiva Sans","Segoe UI",Arial,system-ui,sans-serif;overflow:hidden}
  #view{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff;display:none}
  #msg{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:0 24px}
  #msg b{display:block;color:#fff;font-size:16px;margin-bottom:4px}
  #msg i{display:inline-block;width:26px;height:26px;border-radius:50%;border:3px solid #2a475e;border-top-color:#66c0f4;animation:spin .8s linear infinite;margin-bottom:12px}
  #msg.err i{display:none}
  @keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="msg"><div><i></i><b>Starting the browser</b><span id="sub">Connecting to the Mist server…</span></div></div>
<iframe id="view" allow="fullscreen; autoplay; clipboard-read; clipboard-write; encrypted-media; picture-in-picture" referrerpolicy="no-referrer"></iframe>
<script src="baremux/index.js"></script>
<script src="uv/uv.bundle.js"></script>
<script src="uv.config.js"></script>
<script>
/*
 * One Mist Browser tab. Mist shows this page in an iframe and talks to it with postMessage:
 *   Mist -> tab   {mb:'init', ticket, url}  {mb:'go', url}  {mb:'back'}  {mb:'forward'}  {mb:'reload'}  {mb:'ticket', ticket}
 *   tab  -> Mist  {mb:'ready'}  {mb:'state', url, title, loading}  {mb:'open', url}  {mb:'error', text}
 * Only Mist (this page's parent) is listened to, and the ticket is only ever kept in memory.
 */
(function () {
  'use strict';
  var cfg = self.__uv$config, view = document.getElementById('view'), msg = document.getElementById('msg');
  var BASE = new URL('./', location.href).pathname, ORIGIN = location.origin;
  var conn = null, ready = null, ticket = '', want = '', lastKey = '';
  var parent = window.parent !== window ? window.parent : null;

  function tell(o) { o.mb = o.mb || 'state'; if (parent) parent.postMessage(o, '*'); }
  function show(title, sub, isErr) {
    msg.style.display = ''; msg.className = isErr ? 'err' : '';
    msg.querySelector('b').textContent = title; document.getElementById('sub').textContent = sub || '';
    if (isErr) tell({ mb: 'error', text: title + (sub ? ': ' + sub : '') });
  }
  function wispUrl() { return (location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + BASE + 'wisp/' + encodeURIComponent(ticket) + '/'; }

  var transport = null;     // 'libcurl' or 'epoxy', chosen by the server (/api/status)
  function setTransport() {
    if (!transport) transport = fetch(BASE + 'api/status', { cache: 'no-store' }).then(function (r) { return r.json(); })
      .then(function (j) { return j.transport === 'epoxy' ? 'epoxy' : 'libcurl'; }, function () { return 'libcurl'; });
    return transport.then(function (t) { return conn.setManualTransport(transportCode(BASE + t + '/index.mjs'), [{ wisp: wispUrl() }]); });
  }
  // Runs in the bare-mux worker. libcurl loads its wasm in the background and throws "wasm not loaded yet"
  // if a page asks for something first, so the first request waits for it instead of failing.
  function transportCode(url) {
    var u = JSON.stringify(url);
    return 'const { default: T } = await import(' + u + ');\n' +
      'class MistTransport extends T {\n' +
      '  init() {\n' +
      '    if (!this.mistInit) this.mistInit = (async () => {\n' +
      '      for (let i = 0; ; i++) {\n' +
      '        try { await super.init(); return; }\n' +
      '        catch (e) { if (i > 300 || !/not loaded/i.test(String(e && e.message))) { this.mistInit = null; throw e; } await new Promise(r => setTimeout(r, 100)); }\n' +
      '      }\n' +
      '    })();\n' +
      '    return this.mistInit;\n' +
      '  }\n' +
      '}\n' +
      'return [MistTransport, ' + u + '];';
  }
  function start() {
    if (ready) return ready;
    if (!('serviceWorker' in navigator)) return Promise.reject(new Error('This browser blocks service workers here, which the Mist browser needs. Private windows in some browsers do this.'));
    conn = new BareMux.BareMuxConnection(BASE + 'baremux/worker.js');
    ready = setTransport()
      .then(function () { return navigator.serviceWorker.register(BASE + 'sw.js', { scope: BASE, updateViaCache: 'none' }); })
      .then(function () { return navigator.serviceWorker.ready; })
      .then(function () {
        // the first time, the worker only starts controlling pages after it takes over: wait for that
        if (navigator.serviceWorker.controller) return;
        return new Promise(function (res) {
          var t = setTimeout(res, 3000);
          navigator.serviceWorker.addEventListener('controllerchange', function () { clearTimeout(t); res(); }, { once: true });
        });
      });
    ready.catch(function () { ready = null; });
    return ready;
  }

  function go(url) {
    want = url;
    start().then(function () {
      msg.style.display = 'none'; view.style.display = 'block';
      tell({ url: url, title: '', loading: true });
      view.src = cfg.prefix + cfg.encodeUrl(url);
    }, function (e) { show('The browser couldn’t start', e && e.message || String(e), true); });
  }

  // Read the address and title of whatever the frame is showing and pass them to Mist.
  function decode(href) {
    if (!href || href.indexOf(ORIGIN + cfg.prefix) !== 0) return null;
    try { return cfg.decodeUrl(href.slice((ORIGIN + cfg.prefix).length)); } catch (e) { return null; }
  }
  function report(loading) {
    var url = want, title = '';
    try {
      var w = view.contentWindow;
      url = decode(w.location.href) || url;
      title = w.document.title || '';
    } catch (e) { /* page not readable yet */ }
    var key = url + '\n' + title + '\n' + !!loading;
    if (key === lastKey) return;
    lastKey = key;
    tell({ url: url, title: title, loading: !!loading });
  }
  // Links that would open a new window open a new Mist tab instead.
  function hookLinks() {
    try {
      var d = view.contentWindow.document;
      if (d.__mistHooked) return; d.__mistHooked = true;
      d.addEventListener('click', function (e) {
        var a = e.target && e.target.closest ? e.target.closest('a[href]') : null;
        if (!a || e.defaultPrevented) return;
        var t = (a.getAttribute('target') || '').toLowerCase(), newTab = e.ctrlKey || e.metaKey || e.button === 1 || (t && t !== '_self' && t !== '_top' && t !== '_parent');
        if (!newTab) { if (t === '_top' || t === '_parent') { e.preventDefault(); go(decode(a.href) || a.href); } return; }
        var u = decode(a.href) || a.href;
        if (!/^https?:/i.test(u)) return;
        e.preventDefault(); tell({ mb: 'open', url: u });
      }, true);
    } catch (e) { /* not readable */ }
  }
  view.addEventListener('load', function () { hookLinks(); report(false); });
  setInterval(function () { if (view.style.display === 'block') { hookLinks(); report(false); } }, 700);

  window.addEventListener('message', function (e) {
    if (!parent || e.source !== parent || !e.data || typeof e.data.mb !== 'string') return;
    var m = e.data;
    if (m.mb === 'init') {
      ticket = String(m.ticket || '');
      if (m.url) go(String(m.url)); else start().catch(function (er) { show('The browser couldn’t start', er.message, true); });
    } else if (m.mb === 'ticket') {
      ticket = String(m.ticket || ''); if (conn) setTransport().catch(function () {});
    } else if (m.mb === 'go') go(String(m.url || ''));
    else if (m.mb === 'back') { try { view.contentWindow.history.back(); } catch (er) {} }
    else if (m.mb === 'forward') { try { view.contentWindow.history.forward(); } catch (er) {} }
    else if (m.mb === 'reload') { try { view.contentWindow.location.reload(); } catch (er) { if (want) go(want); } }
  });
  if (!parent) show('Open this from Mist', 'The browser only works inside the Mist launcher.', true);
  else tell({ mb: 'ready' });
})();
</script>
</body>
</html>
