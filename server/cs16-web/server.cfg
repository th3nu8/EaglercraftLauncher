// CS 1.6 browser server — edit freely, setup.sh won't overwrite this file once installed.
hostname "PDC CS 1.6 (browser)"
rcon_password "__RCON_PASSWORD__"
sv_password ""

// All players arrive via the relay from 127.0.0.1, so keep LAN mode off and
// don't rely on IP bans (match relay logs' "udp :<port>" to find a player's real IP).
sv_lan 0

// Round, weapon and respawn rules live in deathmatch.cfg (loaded every map).
mp_friendlyfire 0
sv_alltalk 0

// Browser clients: keep rates reasonable for WebSocket tunnelling.
sv_maxrate 100000
sv_minrate 25000
sv_maxupdaterate 100
sv_minupdaterate 30

// Don't push every player's spray image to everyone when they join (big burst of
// fragmented data at exactly the moment a new player connects).
sv_allowupload 0

mapcyclefile "mapcycle.txt"
log on

// Bots fill the server up to this many players and leave as people join.
bot_quota 8
bot_quota_mode fill
bot_difficulty 1
bot_join_after_player 0
