// =====================================================================
//  Infinite deathmatch, fixed loadout (ReGameDLL_CS)
//  Loaded at the end of game.cfg on every map load. Edit, then type
//  "restart" in the server console (or change map) to apply.
// =====================================================================

// ---- Mode -------------------------------------------------------------
mp_freeforall "0"                 // 0 = team deathmatch (T vs CT), 1 = everyone vs everyone
mp_round_infinite "1"             // rounds never end (no bomb/hostage/elimination/timer wins)
mp_forcerespawn "2"               // respawn 2 seconds after dying
mp_respawn_immunitytime "2"       // 2s spawn protection...
mp_respawn_immunity_force_unset "2" // ...cancelled as soon as you shoot
mp_freezetime "0"
mp_timelimit "0"                  // never change map (set e.g. 30 for a rotation every 30 min)
mp_fraglimit "0"
mp_auto_join_team "1"             // skip the team menu...
humans_join_team "any"            // ...and auto-balance new players into a team

// ---- Loadout (same every life) ---------------------------------------
// Weapon names: ak47 m4a1 awp aug sg552 famas galil mp5navy p90 ump45 mac10 tmp
//               m3 xm1014 m249 scout g3sg1 sg550 | deagle usp glock18 p228 fiveseven elite
mp_t_default_weapons_primary "ak47"
mp_t_default_weapons_secondary "deagle"
mp_ct_default_weapons_primary "m4a1"
mp_ct_default_weapons_secondary "deagle"
mp_t_default_grenades ""          // e.g. "hegrenade flash"
mp_ct_default_grenades ""
mp_t_give_player_knife "1"
mp_ct_give_player_knife "1"
mp_default_weapons_random "0"     // 1 = pick one at random if you list several
mp_free_armor "2"                 // kevlar + helmet on every spawn

// ---- Lock the loadout -------------------------------------------------
mp_buytime "0"                    // buying disabled
mp_weapons_allow_map_placed "0"   // remove weapons lying around the map
mp_weapondrop "0"                 // no weapon drops on death (keeps the floor clean)
mp_ammodrop "0"
mp_nadedrops "0"
mp_give_player_c4 "0"             // no bomb
mp_infinite_ammo "2"              // unlimited reserve ammo (you still reload)
mp_infinite_grenades "0"

// ---- Misc ------------------------------------------------------------
mp_kill_filled_spawn "1"          // don't spawn players stuck inside each other
mp_show_scenarioicon "0"
mp_autoteambalance "1"
mp_limitteams "2"
